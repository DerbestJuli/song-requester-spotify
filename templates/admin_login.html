<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin-Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login card">
    <p class="kicker">Team</p>
    <h1>Admin-Bereich</h1>
    <p class="sub">Passwortgeschützt. Hier werden Anfragen freigegeben und die Musik gesteuert.</p>
    {% if error %}<p class="msg bad">{{ error }}</p>{% endif %}
    <form method="post" style="margin-top:16px">
      <input type="password" name="password" placeholder="Passwort" required autofocus>
      <button type="submit" style="margin-top:10px;width:100%">Anmelden</button>
    </form>
    <p class="note">Passwort steht in der Konsole beim Start bzw. in eurer .env (ADMIN_PASSWORD).</p>
  </div>
</body>
</html>
